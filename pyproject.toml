[build-system]
requires = ["setuptools>=83", "wheel"]  # >=83: known vulnerabilities fixed
build-backend = "setuptools.build_meta"

[project]
name = "floravision"
version = "1.0.0"
description = "Five-class flower classification (tf_flowers) with a fine-tuned ResNet-50."
authors = [{ name = "Esam Mustafa Ali Abduljalil Al-Areqi" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16,<2.22",
    "keras>=3.13",
    "tensorflow-datasets>=4.9",
    "importlib_resources",  # used by tensorflow-datasets, which does not declare it
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "pillow>=12.3",
]

[project.optional-dependencies]
# Starlette and Pillow are pinned to versions with known vulnerabilities fixed.
demo = ["gradio>=6.30,<7", "starlette>=1.3.1", "pillow>=12.3", "fastapi", "uvicorn"]
dev = ["pytest", "ruff", "bandit", "pip-audit", "floravision[demo]"]

[project.scripts]
floravision-train = "floravision.train:main"
floravision-evaluate = "floravision.evaluate:main"
floravision-predict = "floravision.predict:main"
floravision-download = "floravision.download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that train a tiny model"]
filterwarnings = [
    "ignore::DeprecationWarning:keras.*",
    "ignore:`shuffle=True` was passed:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
